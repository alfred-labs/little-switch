[tools]
swiftlint = "0.65.0"
periphery = "3.8.0"

[env]
CLANG_MODULE_CACHE_PATH = "{{config_root}}/.build/clang-cache"
# xcode-select points at CommandLineTools, which cannot build the test
# targets (no swift-testing module under the classic --no-parallel driver).
# Every gate task must run through mise to inherit this pin.
DEVELOPER_DIR = "/Applications/Xcode.app/Contents/Developer"

[tasks.default]
description = "Build LittleSwitch"
run = "mise run build"

[tasks.toolchains]
description = "Verify Xcode, Swift, swift-format, SwiftLint, and arm64"
run = "./tools/ci/check-toolchains.sh"

[tasks."swift:format"]
description = "Require official swift-format output"
run = "swift format lint --strict --recursive Sources Tests Package.swift tools/LittleSwitchUITestHost tools/Sources tools/Tests tools/Package.swift"

[tasks."swift:lint"]
description = "Run pinned SwiftLint semantic rules"
run = "swiftlint lint --strict --no-cache"

[tasks."swift:test"]
description = "Run Swift Testing suites with strict compiler warnings"
run = """
xcrun swift test --disable-sandbox \
  --disable-xctest \
  --toolset tools/ci/appkit-test-runner.json \
  --cache-path .build/cache --config-path .build/config --security-path .build/security \
  -Xswiftc -warnings-as-errors
"""

[tasks."swift:coverage"]
description = "Require exact 100 percent measured Swift line coverage"
run = "./tools/ci/check-swift-coverage.sh"

[tasks."swift:deadcode"]
description = "Require Periphery to find no unreferenced code"
run = """
set -eu
mkdir -p .build/cache .build/config .build/security
xcrun swift package --disable-sandbox \
  --cache-path .build/cache --config-path .build/config --security-path .build/security \
  describe --type json > .build/package-describe.json
# Periphery 3.8 needs the native driver's index store with Xcode 27.
xcrun swift build --disable-sandbox --build-system native --enable-index-store \
  --scratch-path "{{config_root}}/.build/periphery" \
  --cache-path "{{config_root}}/.build/cache" \
  --config-path "{{config_root}}/.build/config" \
  --security-path "{{config_root}}/.build/security" \
  -Xswiftc -warnings-as-errors
periphery scan --strict --baseline .periphery-baseline.yml --skip-build \
  --index-store-path "{{config_root}}/.build/periphery/debug/index/store" \
  --json-package-manifest-path "{{config_root}}/.build/package-describe.json"
"""

[tasks."swift:thread-sanitizer"]
description = "Run concurrency-sensitive tests with Thread Sanitizer"
run = """
# Parallel suite scheduling interleaves NIO continuation setup and resume in a
# way TSAN reports before test teardown; coverage already uses serial mode.
xcrun swift test --disable-sandbox --sanitize=thread --no-parallel \
  --disable-xctest \
  --toolset tools/ci/appkit-test-runner.json \
  --cache-path .build/cache --config-path .build/config --security-path .build/security \
  -Xswiftc -warnings-as-errors
"""

[tasks."swift:build"]
description = "Build the arm64 release executable with strict warnings"
run = "./tools/swift-release.sh"

[tasks."repo:test"]
description = "Run repository policy tests"
run = """
set -eu
mise run tools:test
mise run --quiet tools:run -- repo check
"""

[tasks."tools:build"]
description = "Build the standalone Swift repository tools with strict warnings"
run = """
xcrun swift build --disable-sandbox --package-path tools \
  --scratch-path .build/tooling \
  --cache-path .build/tooling-cache --config-path .build/tooling-config --security-path .build/tooling-security \
  --enable-index-store \
  -Xswiftc -warnings-as-errors
"""

[tasks."tools:test"]
description = "Test the standalone Swift repository tools"
run = """
# Synchronous CLI fixtures must not starve the async loopback HTTP fixtures on
# small CI runners. Match tools:coverage's serial test scheduling.
xcrun swift test --disable-sandbox --package-path tools --no-parallel \
  --scratch-path .build/tooling \
  --cache-path .build/tooling-cache --config-path .build/tooling-config --security-path .build/tooling-security \
  -Xswiftc -warnings-as-errors
"""

[tasks."tools:run"]
description = "Run littleswitch-tools (pass subcommands after --)"
run = """
xcrun swift run --disable-sandbox --package-path tools \
  --scratch-path .build/tooling \
  --cache-path .build/tooling-cache --config-path .build/tooling-config --security-path .build/tooling-security \
  -Xswiftc -warnings-as-errors littleswitch-tools --root "{{config_root}}"
"""

[tasks."tools:deadcode"]
description = "Require no unused production declarations in repository tooling"
dir = "tools"
run = """
set -eu
mkdir -p "{{config_root}}/.build/tooling-cache" \
  "{{config_root}}/.build/tooling-config" "{{config_root}}/.build/tooling-security"
xcrun swift package --disable-sandbox \
  --cache-path "{{config_root}}/.build/tooling-cache" \
  --config-path "{{config_root}}/.build/tooling-config" \
  --security-path "{{config_root}}/.build/tooling-security" \
  describe --type json > "{{config_root}}/.build/tooling-package-describe.json"
# Periphery 3.8 needs the native driver's index store with Xcode 27.
xcrun swift build --disable-sandbox --build-system native --enable-index-store \
  --scratch-path "{{config_root}}/.build/tooling-periphery" \
  --cache-path "{{config_root}}/.build/tooling-cache" \
  --config-path "{{config_root}}/.build/tooling-config" \
  --security-path "{{config_root}}/.build/tooling-security" \
  -Xswiftc -warnings-as-errors
periphery scan --strict --config .periphery.yml --skip-build \
  --index-store-path "{{config_root}}/.build/tooling-periphery/debug/index/store" \
  --json-package-manifest-path "{{config_root}}/.build/tooling-package-describe.json"
"""

[tasks."tools:coverage"]
description = "Require exact 100 percent measured tooling line coverage"
run = "./tools/ci/check-tooling-coverage.sh"

[tasks."monitoring:readiness"]
description = "Wait for the local Prometheus and Loki lab with bounded timeouts"
run = "mise run --quiet tools:run -- monitoring readiness"

[tasks."monitoring:probe"]
description = "Verify synthetic OTLP JSON ingestion and queries in the local lab"
run = "mise run --quiet tools:run -- monitoring probe"

[tasks."monitoring:integration"]
description = "Verify the Swift OTLP exporter against the local Prometheus and Loki lab"
run = """
set -eu
mise run monitoring:readiness
LITTLESWITCH_MONITORING_LAB=1 xcrun swift test --disable-sandbox \
  --cache-path .build/cache --config-path .build/config --security-path .build/security \
  -Xswiftc -warnings-as-errors --filter MonitoringCompose
"""

[tasks."diagnostics:session-tools"]
description = "Report last-request MCP definition counts from explicitly selected log segments"
run = "mise run --quiet tools:run -- diagnostics session-tool-defs"

[tasks."app:build"]
description = "Build the unsigned Apple Silicon application bundle"
run = "./tools/build-app.sh"

[tasks."verify:bundle"]
description = "Verify the native Apple Silicon application bundle"
run = "./tools/ci/verify-bundle.sh"

[tasks."release:bump"]
description = "Increment the release build number (optionally set a new marketing version)"
run = "./tools/release/bump-version.sh"

[tasks."release:dmg"]
description = "Build and Developer-ID sign the ARM64 release DMG"
run = "./tools/release/create-dmg.sh"

[tasks."release:notarize"]
description = "Notarize and staple the signed release DMG"
run = "./tools/release/notarize-dmg.sh"

[tasks."release:verify"]
description = "Verify the signed and notarized release DMG"
run = "./tools/release/verify-dmg.sh"

[tasks."release:publish"]
description = "Publish the DMG as Latest and prepare Sparkle and Homebrew updates (--push publishes both)"
run = "./tools/release/publish-update.sh"

[tasks."release:homebrew"]
description = "Update Homebrew from the verified published DMG (--push publishes the cask)"
run = "./tools/release/publish-homebrew.sh"

[tasks.release]
description = "Build and notarize the DMG, then publish GitHub Latest, Sparkle, and Homebrew"
run = """
set -eu
mise run release:dmg
mise run release:notarize
mise run release:verify
mise run release:publish -- --push
"""

[tasks.build]
description = "Build the Apple Silicon LittleSwitch application"
depends = ["app:build"]

[tasks.check]
description = "Run every local Swift quality gate"
run = """
set -eu
mise run check:repository
mise run check:tests
mise run check:analysis
mise run check:bundle
"""

[tasks."check:repository"]
description = "Check source style, repository tools, schemas, and vendored JSON"
run = """
set -eu
mise run toolchains
mise run swift:format
mise run swift:lint
mise run repo:test
mise run schemas:test
mise run schemas:check
mise run ordered-json:check
mise run ordered-json:tools:test
mise run ordered-json:test
mise run tools:coverage
mise run tools:deadcode
"""

[tasks."check:tests"]
description = "Run all application Swift Testing suites"
run = "mise run swift:test"

[tasks."check:analysis"]
description = "Check application coverage, dead code, and thread safety"
run = """
set -eu
mise run swift:coverage
mise run swift:deadcode
mise run swift:thread-sanitizer
"""

[tasks."check:bundle"]
description = "Build and verify the strict release application bundle"
run = """
set -eu
# app:build includes the strict release build through swift-release.sh.
mise run app:build
mise run verify:bundle
"""

[tasks.clean]
description = "Remove generated SwiftPM and application build products"
run = "swift package clean && rm -rf build"

[tasks."schemas:install"]
description = "Install the exact SDK extraction dependencies without lifecycle scripts"
tools = { node = "24.16.0" }
run = "npm ci --prefix tools/sdk-contracts --ignore-scripts --no-audit --no-fund --cache .cache/sdk-contracts-npm"

[tasks."schemas:test"]
description = "Test deterministic SDK contracts and their validation boundaries"
tools = { node = "24.16.0" }
run = "npm --prefix tools/sdk-contracts test"

[tasks."schemas:extract"]
description = "Regenerate official SDK schema snapshots and their provenance"
tools = { node = "24.16.0" }
run = "npm --prefix tools/sdk-contracts run extract"

[tasks."schemas:upstream:check"]
description = "Verify SDK snapshot hashes and compare a fresh extraction"
tools = { node = "24.16.0" }
run = "npm --prefix tools/sdk-contracts run check"

[tasks."schemas:compare"]
description = "Compare verified old and new SDK snapshots (pass both directories after --)"
tools = { node = "24.16.0" }
run = "npm --silent --prefix tools/sdk-contracts run compare --"

[tasks."schemas:update"]
description = "Extract deliberately updated SDK pins and report changes from the verified previous snapshot"
tools = { node = "24.16.0" }
run = "npm --silent --prefix tools/sdk-contracts run update --"

[tasks."schemas:generate"]
description = "Generate owned Swift contracts from explicit SDK projections"
run = "mise run --quiet tools:run -- contracts generate"

[tasks."schemas:check"]
description = "Verify upstream snapshots and Swift generation without modifying the checkout"
run = """
set -eu
mise run schemas:upstream:check
mise run --quiet tools:run -- contracts check
"""

[tasks."ordered-json:check"]
description = "Verify the pinned OrderedJSON sources, corpus, and local patches"
tools = { node = "24.16.0" }
run = "node tools/ordered-json/check.mjs"

[tasks."ordered-json:tools:test"]
description = "Test OrderedJSON provenance and patch verification"
tools = { node = "24.16.0" }
run = "node --test tools/ordered-json/*.test.mjs"

[tasks."ordered-json:test"]
description = "Qualify the vendored OrderedJSON package and complete upstream corpus"
run = """
xcrun swift test --disable-sandbox --enable-code-coverage \
  --package-path Vendor/OrderedJSON --scratch-path .build/ordered-json \
  --cache-path .build/cache --config-path .build/config --security-path .build/security \
  -Xswiftc -warnings-as-errors
"""
